name: Build Origins Launcher

on:
  workflow_dispatch:

# Les fichiers fabriqués vont dans une Release GitHub « build-<version> » (pré-version), un zip par système :
# les Releases ne comptent pas dans le quota des artefacts (plein le 17/11), et le zip garde les noms exacts
# des fichiers (latest-linux.yml en dépend). scripts/deploy-launcher.js les récupère là.
permissions:
  contents: write

# Les artefacts portent la version du launcher (package.json) dans leur nom,
# par exemple Origins-Launcher-Linux-0.6.5 : scripts/deploy-launcher.js les retrouve
# ainsi pour mettre en ligne les fichiers Mac et Linux de la même version que Windows.

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read launcher version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run build:win

      - name: "Release : installeur Windows"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          ZIP="$PWD/Origins-Launcher-Windows-$VERSION.zip"
          (cd release && 7z a -tzip -bd "$ZIP" *.exe)
          gh release view "build-$VERSION" > /dev/null 2>&1 || gh release create "build-$VERSION" --prerelease --target "$GITHUB_SHA" --title "Fabrication $VERSION" --notes "Fichiers fabriqués par « Build Origins Launcher », récupérés par scripts/deploy-launcher.js." || true
          gh release upload "build-$VERSION" "$ZIP" --clobber

  build-linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read launcher version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build Linux
        run: npm run build:linux

      # latest-linux.yml et le .blockmap permettent à l'AppImage de se mettre à jour toute seule.
      - name: "Release : paquets Linux"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          ZIP="$PWD/Origins-Launcher-Linux-$VERSION.zip"
          (cd release && zip -q "$ZIP" *.AppImage *.deb *.blockmap latest-linux.yml)
          gh release view "build-$VERSION" > /dev/null 2>&1 || gh release create "build-$VERSION" --prerelease --target "$GITHUB_SHA" --title "Fabrication $VERSION" --notes "Fichiers fabriqués par « Build Origins Launcher », récupérés par scripts/deploy-launcher.js." || true
          gh release upload "build-$VERSION" "$ZIP" --clobber

  build-macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read launcher version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build macOS
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Sans signature Apple, le Mac ne se met pas à jour tout seul : seulement les .dmg (et leurs .blockmap).
      - name: "Release : paquets macOS"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          ZIP="$PWD/Origins-Launcher-macOS-$VERSION.zip"
          (cd release && zip -q "$ZIP" *.dmg *.blockmap)
          gh release view "build-$VERSION" > /dev/null 2>&1 || gh release create "build-$VERSION" --prerelease --target "$GITHUB_SHA" --title "Fabrication $VERSION" --notes "Fichiers fabriqués par « Build Origins Launcher », récupérés par scripts/deploy-launcher.js." || true
          gh release upload "build-$VERSION" "$ZIP" --clobber

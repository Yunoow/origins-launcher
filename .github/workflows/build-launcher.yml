name: Build Origins Launcher

on:
  workflow_dispatch:

# Les artefacts portent la version du launcher (package.json) dans leur nom,
# par exemple Origins-Launcher-Linux-0.6.5 : scripts/deploy-launcher.js les retrouve
# ainsi pour mettre en ligne les fichiers Mac et Linux de la même version que Windows.

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read launcher version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run build:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Origins-Launcher-Windows-${{ steps.version.outputs.value }}
          path: |
            release/*.exe
          if-no-files-found: error

  build-linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read launcher version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build Linux
        run: npm run build:linux

      # latest-linux.yml et le .blockmap permettent à l'AppImage de se mettre à jour toute seule.
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: Origins-Launcher-Linux-${{ steps.version.outputs.value }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest-linux.yml
          if-no-files-found: error

  build-macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read launcher version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build macOS
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Sans signature Apple, le Mac ne se met pas à jour tout seul : seulement les .dmg (et leurs .blockmap).
      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: Origins-Launcher-macOS-${{ steps.version.outputs.value }}
          path: |
            release/*.dmg
            release/*.blockmap
          if-no-files-found: error

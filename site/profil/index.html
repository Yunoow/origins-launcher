<style>
/* Mon profil (maquette « Site Origins · Profil », design/site/Site-Profil.dc.html). */
.banniere-profil {
  padding: 130px 0 34px;
  background: linear-gradient(180deg, rgba(15, 11, 8, 0.2), rgba(15, 11, 8, 0.6) 70%, var(--ebene)), url("/commun/images/fond-origins.jpg") center 40% / cover no-repeat;
}
.banniere-profil .contenant { display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap; }
.banniere-profil .avatar.avatar-xl { width: 140px; height: 140px; border: 4px solid var(--or); font-size: 56px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5); }
.identite { flex: 1; min-width: 260px; padding-bottom: 6px; }
.identite h1 { margin: 6px 0 12px; font: 800 clamp(34px, 4vw, 48px)/1 var(--titre); color: #fff; }
.lignes-identite { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; font-size: 14.5px; color: var(--texte); }
.puce-id {
  display: inline-flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px 0 12px; border-radius: 10px;
  background: rgba(15, 11, 8, 0.6); border: 1px solid var(--filet-fort); color: #fff; font-weight: 800; cursor: pointer;
}
.puce-id code { font: 700 13.5px var(--mono); letter-spacing: 0.08em; color: var(--or-clair); }
.puce-id .icone { width: 15px; height: 15px; color: var(--doux); }

.grille-profil { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; padding: 26px 0 72px; }
.colonne-profil { display: flex; flex-direction: column; gap: 22px; }
.bloc { padding: 24px; background: var(--carte); scroll-margin-top: 90px; }
.bloc-tete { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.bloc h2 { margin: 0; font: 800 23px var(--titre); color: #fff; }
.bloc > p { margin: 0 0 10px; font-size: 14.5px; color: var(--doux); }
.nombre { padding: 3px 10px; border-radius: 999px; background: rgba(201, 161, 74, 0.16); font-weight: 800; font-size: 12.5px; color: var(--or-clair); }

.comptes { list-style: none; margin: 8px 0 0; padding: 0; }
.comptes li { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 12px; border-radius: 14px; }
.comptes li + li { border-top: 1px solid var(--filet); border-radius: 0; }
.comptes .rond { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.06); color: var(--or); }
.comptes strong { display: block; font: 800 16px var(--titre); color: #fff; }
.comptes span.sous { font-size: 13.5px; color: var(--doux); }
.etat-ok { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; color: var(--vert); }
.etat-ok .icone { width: 16px; height: 16px; }
.actions-compte { display: flex; gap: 8px; align-items: center; }

.vide { display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 14px; border: 1px dashed rgba(255, 255, 255, 0.14); }
.vide .rond { flex: none; width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.06); color: var(--doux); }
.vide strong { display: block; font: 800 16px var(--titre); color: #fff; }
.vide span { font-size: 13.5px; color: var(--doux); }

.amis-apercu { display: flex; margin: 6px 0 12px; }
.amis-apercu .avatar { width: 40px; height: 40px; border: 2px solid var(--panneau); font-size: 16px; }
.amis-apercu .avatar + .avatar, .amis-apercu .plus-amis { margin-left: -8px; }
.plus-amis { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--panneau-clair); border: 2px solid var(--panneau); font-weight: 800; font-size: 12.5px; color: var(--doux); }

.sessions { list-style: none; margin: 4px 0 16px; padding: 0; }
.sessions li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--filet); }
.sessions .icone { color: var(--doux); }
.sessions strong { display: block; font-size: 14.5px; color: #fff; }
.sessions span.sous { font-size: 12.5px; color: var(--doux); }
.celui-ci { padding: 3px 9px; border-radius: 999px; background: rgba(76, 211, 138, 0.14); color: var(--vert); font-size: 11px; font-weight: 800; letter-spacing: 0.1em; }
.bouton-texte { border: 0; background: none; padding: 4px; color: var(--or); font: 800 14px var(--titre); cursor: pointer; }
.bouton-texte:hover { color: var(--or-clair); }

.avis {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 40; max-width: calc(100vw - 32px);
  padding: 12px 18px; border-radius: 14px; background: var(--panneau-clair); border: 1px solid rgba(201, 161, 74, 0.5);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5); font-weight: 700; color: #fff;
}
.mes-tickets { list-style: none; margin: 4px 0 0; padding: 0; }
.mes-tickets a { display: grid; grid-template-columns: 10px 1fr auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--filet); color: inherit; text-decoration: none; }
.mes-tickets a:hover strong { color: var(--or-clair); }
.mes-tickets .point { width: 8px; height: 8px; border-radius: 50%; background: var(--or); }
.mes-tickets .point.non-lu { background: var(--rouge); }
.mes-tickets strong { display: block; font: 800 15px var(--titre); color: #fff; }
.mes-tickets .quoi span { font-size: 12.5px; color: var(--doux); }
.etat { display: inline-block; padding: 3px 9px; border-radius: 999px; font: 800 10.5px var(--police); letter-spacing: 0.1em; white-space: nowrap; }
.etat-ouvert { background: rgba(226, 87, 76, 0.16); color: #ff9a8f; } .etat-en_cours { background: rgba(201, 161, 74, 0.18); color: var(--or-clair); }
.etat-attente { background: rgba(110, 150, 230, 0.18); color: #a9c2ff; } .etat-resolu { background: rgba(76, 211, 138, 0.14); color: var(--vert); }
.chargement { padding: 160px 0; text-align: center; color: var(--doux); }

@media (max-width: 1000px) { .grille-profil { grid-template-columns: 1fr; } }
@media (max-width: 860px) {
  .banniere-profil { padding: 96px 0 24px; }
  .banniere-profil .avatar.avatar-xl { width: 96px; height: 96px; font-size: 40px; }
  .comptes li { grid-template-columns: 40px 1fr; }
  .comptes li > :last-child { grid-column: 2; justify-self: start; }
}
</style>

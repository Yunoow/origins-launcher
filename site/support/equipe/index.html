<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boîte du staff · Origins</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0b08">
<link rel="icon" href="/commun/images/oeil.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/commun/site.css">
<link rel="stylesheet" href="/support/tickets.css">
<style>
/* Boîte du staff (maquette « Site Origins · Tickets », design/site/Site-Tickets.dc.html). Réservée à l'équipe. */
.boite { display: grid; grid-template-columns: 236px minmax(280px, 360px) minmax(0, 1fr) 270px; min-height: calc(100vh - 76px); border-top: 1px solid var(--filet); }
.boite > * { min-width: 0; }
.cote { padding: 26px 16px; border-right: 1px solid var(--filet); }
.cote h1 { margin: 6px 0 22px; font: 800 26px var(--titre); color: #fff; }
.vues { display: flex; flex-direction: column; gap: 4px; }
.vues button, .cats button {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 0; border-radius: 11px;
  background: transparent; color: var(--texte); font: 700 14.5px var(--police); cursor: pointer; text-align: left;
}
.vues button:hover, .cats button:hover { background: rgba(255, 255, 255, 0.04); color: #fff; }
.vues button[aria-pressed="true"], .cats button[aria-pressed="true"] { background: rgba(201, 161, 74, 0.14); color: #fff; }
.vues .n { margin-left: auto; font-size: 13px; color: var(--doux); }
.vues .rouge { width: 7px; height: 7px; border-radius: 50%; background: var(--rouge); }
.cats { margin-top: 26px; }
.cats .kicker { padding: 0 12px 8px; display: block; font-size: 11px; }
.cats button::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--cat, var(--or)); }
.colonne-liste { border-right: 1px solid var(--filet); padding: 16px; }
.recherche { position: relative; margin-bottom: 14px; }
.recherche input { width: 100%; height: 44px; padding: 0 14px 0 40px; border-radius: 12px; border: 1.5px solid rgba(255, 255, 255, 0.14); background: rgba(15, 11, 8, 0.45); color: #fff; font: 600 14.5px var(--police); }
.recherche input:focus { outline: none; border-color: var(--or); }
.recherche .icone { position: absolute; left: 13px; top: 13px; color: var(--doux); }
.ticket-item .avatar { width: 36px; height: 36px; font-size: 15px; }
.centre { display: flex; flex-direction: column; min-width: 0; }
.centre .conversation { border: 0; border-radius: 0; background: transparent; min-height: 0; flex: 1; }
.centre .fil { max-height: none; flex: 1; }
.onglets-composer { display: flex; gap: 6px; margin-bottom: 10px; }
.onglets-composer button { height: 34px; padding: 0 12px; border-radius: 9px; border: 0; background: transparent; color: #fff; font: 800 13.5px var(--police); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.onglets-composer button[aria-pressed="true"] { background: #fff; color: var(--or-fonce); }
.composer.note textarea { border-style: dashed; border-color: rgba(201, 161, 74, 0.6); }
.fiche { padding: 26px 18px; border-left: 1px solid var(--filet); }
.fiche .avatar.grand { width: 72px; height: 72px; font-size: 30px; margin: 0 auto; display: flex; }
.fiche h2 { margin: 12px 0 2px; text-align: center; font: 800 22px var(--titre); color: #fff; }
.fiche .id { text-align: center; font-size: 12.5px; color: var(--doux); }
.fiche .id code { font-family: var(--mono); color: var(--or-clair); }
.fiche dl { margin: 18px 0 0; }
.fiche .ligne { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--filet); font-size: 14px; }
.fiche dt { color: var(--doux); }
.fiche dd { margin: 0; font-weight: 800; color: #fff; text-align: right; }
.fiche .vert { color: var(--vert); }
.fiche h3 { margin: 22px 0 10px; font: 800 11.5px var(--police); letter-spacing: 0.18em; color: var(--or); }
.fiche .precedent { display: block; padding: 8px 0; color: #fff; text-decoration: none; font-weight: 800; font-size: 14px; }
.fiche .precedent span { display: block; font-size: 12px; font-weight: 600; color: var(--doux); }
.acces { max-width: 560px; margin: 120px auto; padding: 32px; text-align: center; }
.acces h1 { margin: 0 0 10px; font: 800 28px var(--titre); color: #fff; }
.acces p { color: var(--texte); }
@media (max-width: 1280px) { .boite { grid-template-columns: 210px minmax(260px, 320px) minmax(0, 1fr); } .fiche { display: none; } }
@media (max-width: 900px) { .boite { grid-template-columns: 1fr; } .cote, .colonne-liste { border-right: 0; border-bottom: 1px solid var(--filet); } }
</style>
</head>
<body data-page="support" data-titre="titrePage">
<div id="site-tete" data-style="plein"></div>

<main id="equipe" aria-busy="true">
  <p class="liste-vide" style="padding: 160px 0">Chargement…</p>
</main>

<script>
window.TEXTES_PAGE = { fr: { titrePage: "Boîte du staff", maintenant: "à l'instant" } };
</script>
<script src="/commun/site.js"></script>
<script src="/support/tickets-commun.js"></script>
<script src="/support/equipe/equipe.js"></script>
</body>
</html>
